repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix, --config, dh_abstracts/pyproject.toml]
      - id: ruff-format
        name: ruff (format)
        args: [--config, dh_abstracts/pyproject.toml]
