[project]
name = "dh_abstracts"
version = "0.1.0"
description = ""
authors = [{ name = "Matthew Lincoln", email = "matthew.d.lincoln@gmail.com" }]
requires-python = ">=3.9,<3.10"
dependencies = [
    "cssselect~=1.1.0",
    "django~=3.2.14",
    "django-autocomplete-light==3.5.1",
    "django-compressor==4.0",
    "django-coverage-plugin~=2.0.2",
    "django-crispy-forms>=1.11,<1.12",
    "django-debug-toolbar~=3.2.4",
    "django-filer>=2.2,<2.3",
    "django-libsass>=0.9,<0.10",
    "django-markdownify~=0.9.1",
    "gunicorn~=20.1.0",
    "lxml~=4.9.1",
    "progress>=1.6,<1.7",
    "psycopg2-binary~=2.9.3",
    "python-memcached>=1.59,<1.60",
    "setuptools<70",
    "tblib~=1.7.0",
    "w3lib~=1.22.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
extend-exclude = [
    "migrations",
    "dh_abstracts/dhweb/settings.py",
]

[tool.ruff.lint]
# Approximate flake8's default rule set: pyflakes (F) + pycodestyle (E, W).
# Note: this is an approximation, not a byte-identical reproduction. flake8 has a
# built-in default-ignore list (E121, E123, E126, E226, E24, E704, W503, W504).
# ruff does not replicate that list; instead it omits the formatter-conflicting
# rules entirely (W503/W504 and E704 are not implemented in ruff as of 0.15.x),
# so there is nothing to re-ignore here. The remaining flake8-ignored codes
# (E121, E123, E126, E226, E24) are likewise not implemented as distinct rules
# in this ruff version. The Phase 3 diff review is the real check for any
# unexpected rule changes.
select = ["E", "F", "W"]
# E501 (line too long) and E722 (bare except) are ignored repo-wide: the project
# never had a `.flake8` config, so neither was ever enforced, and the existing
# source has 113 long lines (largely user-facing string literals) and 16 bare
# excepts. Ignoring them here keeps this change a pure tooling swap; tightening
# these is a possible future hardening pass. All other E/F/W rules remain active
# and are enforced by the pre-commit hook on new code.
ignore = ["E501", "E722"]

[tool.ruff.format]
# Ruff's default style is black-compatible. No overrides needed.
