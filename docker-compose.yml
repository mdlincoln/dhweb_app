# Development infrastructure only: Postgres + Redis.
#
# Local dev runs Django directly on the host via `uv run ...` (see the Makefile)
# against the services below, whose ports are published to localhost. The full
# application stack (app + nginx + redis + postgres) is defined in
# docker-compose.prod.yml for production deployments.
#
# The `db` named volume is shared with docker-compose.prod.yml, so dev and prod
# compose both see the same Postgres data.
services:
  postgres:
    image: postgres:18
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file: .env

  redis:
    image: redis:7.4
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no

volumes:
  db: null