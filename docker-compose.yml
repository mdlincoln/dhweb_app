# Development infrastructure only: Postgres.
#
# Local dev runs Django directly on the host via `uv run ...` (see the Makefile)
# against the service below, whose port is published to localhost. The full
# application stack (app + nginx + postgres) is defined in
# docker-compose.prod.yml for production deployments.
#
# The `db` named volume is shared with docker-compose.prod.yml, so dev and prod
# compose both see the same Postgres data.
services:
  postgres:
    image: postgres:18
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "5432:5432"
    env_file: .env

volumes:
  db: null